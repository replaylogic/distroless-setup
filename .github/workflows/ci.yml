name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs, with the human-readable version in
# the trailing comment. See CONTRIBUTING.md ("Updating pinned GitHub Actions") before
# changing one; Dependabot proposes the updates (.github/dependabot.yml).

jobs:
  test:
    name: unit (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 22 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke test the packed CLI
        shell: bash
        run: |
          npm pack
          npm install -g ./distroless-setup-*.tgz
          distroless-setup --version
          distroless-setup --help

  integration:
    # Docker-backed tests build and run the images the CLI generates. They are slow, so
    # they run once, on Linux, on the current LTS: not across the whole unit-test matrix.
    name: container integration (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: docker version
      - run: npm ci
      - run: npm run test:integration

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: always()
    steps:
      - name: Check job results
        run: |
          failed=0
          for result in "${{ needs.test.result }}" "${{ needs.integration.result }}"; do
            if [ "$result" != "success" ]; then
              echo "a required job did not succeed: $result"
              failed=1
            fi
          done
          exit "$failed"
