name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs, with the human-readable version in
# the trailing comment. See CONTRIBUTING.md ("Updating pinned GitHub Actions") before
# changing one; Dependabot proposes the updates (.github/dependabot.yml).

jobs:
  classify:
    # Documentation/support-only changes (docs/**, README.md, etc. — see
    # .github/scripts/classify-ci-changes.sh) don't need the expensive unit
    # matrix or Docker integration tests. This job decides, for every push
    # and PR, whether that heavy product CI is required. It intentionally
    # fails safe: any uncertainty resolves to run_full_ci=true. See
    # CONTRIBUTING.md ("CI behavior") for the full rationale.
    name: classify
    runs-on: ubuntu-latest
    outputs:
      run_full_ci: ${{ steps.classify.outputs.run_full_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the classifier diffs against a base commit that
          # may be many commits behind HEAD, for both push and PR events.
          fetch-depth: 0
      - name: Self-test the change classifier
        run: bash .github/scripts/classify-ci-changes.test.sh
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Diff against the merge-base, not the base branch tip: commits
            # landed on the base branch after this PR branched off must not
            # be attributed to the PR's own change set.
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
            compare_base="${merge_base:-$BASE_SHA}"
          else
            compare_base="$BASE_SHA"
          fi
          bash .github/scripts/classify-ci-changes.sh "$compare_base" "$HEAD_SHA"

  test:
    name: unit (node ${{ matrix.node }}, ${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.run_full_ci == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 22 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke test the packed CLI
        shell: bash
        run: |
          npm pack
          npm install -g ./distroless-setup-*.tgz
          distroless-setup --version
          distroless-setup --help

  integration:
    # Docker-backed tests build and run the images the CLI generates. They are slow, so
    # they run once, on Linux, on the current LTS: not across the whole unit-test matrix.
    name: container integration (docker)
    needs: classify
    if: needs.classify.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: docker version
      - run: npm ci
      - run: npm run test:integration

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs: [classify, test, integration]
    if: always()
    steps:
      - name: Check job results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RUN_FULL_CI: ${{ needs.classify.outputs.run_full_ci }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "change classification did not succeed: $CLASSIFY_RESULT"
            exit 1
          fi

          if [ "$RUN_FULL_CI" = "true" ]; then
            # Product change: test and integration were required to run and
            # must both have succeeded. skipped/cancelled/failed all fail
            # this check -- a docs-only classification is the ONLY path that
            # may accept a skipped product job.
            failed=0
            for result in "$TEST_RESULT" "$INTEGRATION_RESULT"; do
              if [ "$result" != "success" ]; then
                echo "a required product CI job did not succeed: $result"
                failed=1
              fi
            done
            if [ "$failed" -ne 0 ]; then
              exit 1
            fi
            echo "Product change: unit and integration jobs both succeeded."
          elif [ "$RUN_FULL_CI" = "false" ]; then
            echo "Documentation/support-only change: heavy CI intentionally skipped."
          else
            echo "unexpected run_full_ci value from classify job: '$RUN_FULL_CI'"
            exit 1
          fi
